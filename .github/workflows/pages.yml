# Optional test hosting on GitHub Pages (only the app and fictitious demo data; real data is loaded on the device).
# Runs only when the repository variable PAGES_ENABLED is "true"
# (Settings > Secrets and variables > Actions > Variables) and Settings > Pages > Source = "GitHub Actions".
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node tools/check.js
      - name: Stamp app version (makes installed apps update)
        run: sed -i "s/const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::8}';/" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4

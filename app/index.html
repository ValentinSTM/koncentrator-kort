<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koncentrator">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Koncentrator-kort</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1 data-i18n="appTitle">Koncentrator-kort</h1>
  <button class="src" id="srcBadge" data-tab="more">DEMO</button>
  <div class="langs" role="group" aria-label="Sprog / Language / Limba">
    <button data-lang="da">DA</button><button data-lang="en">EN</button><button data-lang="ro">RO</button>
  </div>
</header>
<div class="searchbar">
  <input id="q" type="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="searchPh" placeholder="Søg">
  <button class="iconbtn" data-act="filter" data-i18n-aria="filter" aria-label="Filter">⚙︎<span class="count" id="filterCount" hidden></span></button>
</div>
<div id="app">
  <section id="v-map" class="view">
    <div id="map" role="application" aria-label="Map"></div>
    <div id="mapNote" class="alert info toast-top" hidden></div>
    <button id="btnLocate" class="fab" style="top:12px" data-act="locate" data-i18n-aria="showNearest" aria-label="GPS">📍</button>
    <button class="fab" style="top:152px" data-act="antenna" data-i18n-aria="arOpen" aria-label="Antenne">📡</button>
    <button id="btnSim" class="fab" style="top:82px" data-act="sim" data-i18n-aria="posTitle" aria-label="Min position">📌</button>
    <div id="nearSheet"></div>
  </section>
  <section id="v-list" class="view" hidden><div class="pad" id="listWrap"></div></section>
  <section id="v-detail" class="view" hidden><div class="pad" id="detailWrap"></div></section>
  <section id="v-more" class="view" hidden><div class="pad" id="moreWrap"></div></section>
</div>
<nav class="tabs">
  <button class="t-map" data-tab="map" aria-current="page"><span class="ic">🗺️</span><span data-i18n="tabMap">Kort</span></button>
  <button data-tab="list"><span class="ic">☰</span><span data-i18n="tabList">Liste</span></button>
  <button data-tab="more"><span class="ic">⋯</span><span data-i18n="tabMore">Mere</span></button>
</nav>
<div id="arView" hidden>
  <div id="arStage"><video id="arVideo" playsinline muted autoplay></video><canvas id="arCanvas"></canvas>
    <div id="arTop"><div id="arTechs" class="chips"></div><button class="iconbtn" data-aract="close" aria-label="Luk">✕</button></div>
    <div id="arHint"></div>
  </div>
  <div id="arPanel">
    <div class="arRow"><div id="arMeterTxt" style="flex:1"></div><button class="btn small primary" data-aract="scanMeter" data-i18n="arScanMeter">Scan QR</button><button class="btn small outline" data-aract="editMeter" aria-label="✎">✎</button></div>
    <div id="arMeterForm" class="arRow" hidden><input id="arSerial" inputmode="numeric" autocomplete="off" data-i18n-ph="meterSerial" placeholder="Serienr."><input id="arOrder" inputmode="numeric" autocomplete="off" data-i18n-ph="meterOrder" placeholder="Ordre"><button class="btn small go" data-aract="meterOk">OK</button></div>
    <div id="arTargets" class="chips"></div>
    <div id="arInfo"></div>
    <div class="arRow"><label class="muted" for="arFov" data-i18n="arFov">Kameravinkel</label><input id="arFov" type="range" min="30" max="80" step="1"><span id="arFovVal" class="muted"></span>
      <button class="btn small outline" data-aract="compass" id="arCompassBtn" hidden>🧭</button></div>
    <button class="shutter" id="arShutter" data-aract="shoot" data-i18n-aria="arShoot" aria-label="Foto"></button>
  </div>
</div>
<div id="sheet" hidden></div>
<div id="viewer" hidden><img id="viewerImg" alt=""><div class="bar"><div class="txt" id="viewerTxt"></div>
  <button class="btn small ghost" id="viewerPrev">‹</button><button class="btn small ghost" id="viewerNext">›</button><button class="btn small warn" id="viewerClose">✕</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="updBar" hidden><span data-i18n="updReady">Ny version klar</span><button class="btn small warn" data-act="applyUpdate" data-i18n="updNow">Opdatér</button></div>
<input id="fileIn" type="file" accept="image/*" capture="environment" hidden>
<input id="jsonIn" type="file" accept=".json,application/json" hidden>
<input id="qrIn" type="file" accept="image/*" capture="environment" hidden>
<input id="chgIn" type="file" accept=".json,application/json" multiple hidden>
<input id="dirIn" type="file" accept="image/*" multiple webkitdirectory hidden>
<script id="placement-dict" type="application/json"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/ar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2a3c">
<title>Koncentrator Finder – demo</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* High contrast, large targets, gloves, outdoors. Same visual language as LinkIQ Field Assistant. */
:root{
  --ink:#0b1f2a;--paper:#f4f6f7;--card:#fff;--line:#c9d2d8;--navy:#0b2a3c;--blue:#1565c0;
  --yellow:#f9c400;--green:#1b7a35;--gray:#55626b;--light:#e3e8ec;--red:#c62828;--warnbg:#fff4cc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1;font-weight:650}
.pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--yellow);color:var(--ink);white-space:nowrap}
header select{width:auto;padding:4px 6px;font-size:14px;border-radius:8px;border:0;min-height:34px}
.searchbar{display:flex;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line)}
.searchbar input{flex:1;min-width:0}
.searchbar button{width:auto;min-width:54px;padding:0 12px}
#filterCount{display:inline-block;min-width:20px;background:var(--yellow);color:var(--ink);border-radius:99px;font-size:13px;padding:0 6px;margin-left:4px}
#filterCount:empty{display:none}
#app{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.view[hidden]{display:none}
#v-map{padding:0;overflow:hidden}
#map{position:absolute;inset:0;background:#dfe6ea}
#map.notiles{background-color:#e9eef1;background-image:linear-gradient(#d3dbe0 1px,transparent 1px),linear-gradient(90deg,#d3dbe0 1px,transparent 1px);background-size:40px 40px}
.wrap{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:15px;margin:0 0 6px}
label{font-weight:650;font-size:15px;display:block;margin:8px 0 4px}
input,select,textarea{font:inherit;padding:12px;border:2px solid var(--gray);border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 14px;min-height:52px;cursor:pointer;width:100%;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.primary{background:var(--blue);color:#fff}
.go{background:var(--green);color:#fff}
.warn{background:var(--yellow);color:var(--ink)}
.danger{background:var(--red);color:#fff}
.ghost{background:var(--light);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.row>*{flex:1}
.muted{color:var(--gray);font-size:14px}
.small{font-size:14px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--light);color:var(--ink);white-space:nowrap}
.b-ok{background:#d7f0dd;color:#0d4d1f}.b-warn{background:var(--warnbg);color:#5c4400}.b-bad{background:#fbdcdc;color:#7a1414}.b-off{background:#e1e4e6;color:#3a4248}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.alert{border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warnbg);border:2px solid var(--yellow)}
.alert.info{background:#e3effc;border:2px solid #9cc2ef}
.alert.bad{background:#fbdcdc;border:2px solid var(--red)}
/* list */
.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;min-height:72px;text-align:left;width:100%;font-weight:400}
.item img{width:58px;height:58px;border-radius:8px;object-fit:cover;flex:none;background:var(--light)}
.item .noimg{width:58px;height:58px;border-radius:8px;flex:none;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gray);text-align:center}
.item .main{flex:1;min-width:0}
.item .id{font-weight:800}
.item .sub{font-size:14px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .dist{font-weight:800;font-size:15px;text-align:right;white-space:nowrap}
/* map overlays */
.mapfab{position:absolute;right:12px;z-index:500;width:58px;height:58px;min-height:0;border-radius:50%;padding:0;font-size:24px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#nearest{position:absolute;left:8px;right:8px;bottom:8px;z-index:500;max-width:640px;margin:0 auto}
#tileNote{position:absolute;left:56px;top:10px;right:80px;z-index:500;font-size:13px;max-width:460px}
.you{width:20px;height:20px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 2px var(--blue)}
/* detail */
.hero{position:relative;border-radius:12px;overflow:hidden;background:var(--light);aspect-ratio:4/3;cursor:pointer;border:0;padding:0;min-height:0}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(11,31,42,.75);color:#fff;font-size:14px;padding:6px 10px;text-align:left;font-weight:500}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs button{padding:0;min-height:0;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--light);position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .star{position:absolute;top:2px;left:4px;font-size:16px;text-shadow:0 0 3px #000;color:var(--yellow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--gray)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.place{font-size:20px;font-weight:800;display:flex;gap:8px;align-items:center}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.timeline li{border-left:4px solid var(--line);padding:2px 0 2px 10px;font-size:15px}
.timeline li.sms-out{border-color:var(--blue)}.timeline li.sms-in{border-color:var(--green)}.timeline li.ev-move{border-color:var(--yellow)}.timeline li.ev-bad{border-color:var(--red)}
.timeline time{display:block;font-size:13px;color:var(--gray)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:auto;min-height:44px;padding:8px 14px;border-radius:99px;background:#fff;border:2px solid var(--gray);color:var(--ink);font-weight:700}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
/* tabs */
nav.tabs{display:flex;background:#fff;border-top:1px solid var(--line)}
nav.tabs button{flex:1;border-radius:0;background:#fff;color:var(--gray);font-size:13px;flex-direction:column;gap:2px;min-height:60px;padding:6px 2px}
nav.tabs button span{font-size:22px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--navy);box-shadow:inset 0 4px 0 var(--yellow)}
/* sheet dialog */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .panel{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
#sheet .panel h2{margin:0;font-size:19px}
#viewer{position:fixed;inset:0;background:#000;z-index:2500;display:flex;flex-direction:column}
#viewer[hidden]{display:none}
#viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
#viewer .bar{display:flex;gap:8px;padding:10px;color:#fff;align-items:center}
#viewer .bar .txt{flex:1;font-size:14px}
#viewer .bar button{width:auto}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;z-index:3000;max-width:90vw;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.skel{background:linear-gradient(90deg,#e3e8ec,#f1f4f6,#e3e8ec);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:72px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:24px 12px;color:var(--gray)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.leaflet-container{font:inherit}
@media (min-width:960px){
  #app{display:grid;grid-template-columns:1fr 440px}
  .view{position:relative;inset:auto}
  #v-map{grid-column:1;grid-row:1;display:block!important}
  .view:not(#v-map){grid-column:2;grid-row:1;border-left:1px solid var(--line)}
  nav.tabs .t-map{display:none}
}
</style>
</head>
<body>
<header>
  <h1 data-i18n="appTitle">Koncentrator Finder</h1>
  <span class="pill" data-i18n="demoPill">DEMO · fiktive data</span>
  <select id="lang" aria-label="Sprog / Limba"><option value="da">DA</option><option value="ro">RO</option></select>
</header>
<div class="searchbar">
  <input id="q" type="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="Søg: ID, adresse, by, postnr., placering">
  <button id="btnFilter" class="ghost" aria-label="Filter">⚙︎<span id="filterCount"></span></button>
</div>
<div id="app">
  <section id="v-map" class="view">
    <div id="map" role="application" aria-label="Kort"></div>
    <div id="tileNote" class="alert info" hidden></div>
    <button id="btnLocate" class="mapfab primary" style="top:12px" aria-label="Min position">📍</button>
    <button id="btnSimPos" class="mapfab ghost" style="top:80px" aria-label="Simulér position" hidden>🎯</button>
    <div id="nearest"></div>
  </section>
  <section id="v-list" class="view" hidden><div class="wrap" id="listWrap"></div></section>
  <section id="v-detail" class="view" hidden><div class="wrap" id="detailWrap"></div></section>
  <section id="v-jobs" class="view" hidden><div class="wrap" id="jobsWrap"></div></section>
  <section id="v-job" class="view" hidden><div class="wrap" id="jobWrap"></div></section>
  <section id="v-more" class="view" hidden><div class="wrap" id="moreWrap"></div></section>
</div>
<nav class="tabs">
  <button class="t-map" data-tab="map" aria-current="page"><span>🗺️</span><b data-i18n="tabMap">Kort</b></button>
  <button data-tab="list"><span>☰</span><b data-i18n="tabList">Liste</b></button>
  <button data-tab="jobs"><span>🛠️</span><b data-i18n="tabJobs">Sager</b></button>
  <button data-tab="more"><span>⋯</span><b data-i18n="tabMore">Mere</b></button>
</nav>
<div id="sheet" hidden><div class="panel" id="sheetPanel"></div></div>
<div id="viewer" hidden><img id="viewerImg" alt=""><div class="bar"><div class="txt" id="viewerTxt"></div><button class="ghost" id="viewerPrev">‹</button><button class="ghost" id="viewerNext">›</button><button class="warn" id="viewerClose">✕</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="fileIn" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>

<script src="vendor/leaflet.js"></script>

  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

const STORAGE_KEY = 'koncentrator-finder-demo-v1';
const LocalAdapter = {
  memory:null, persistOk:true,
  load(){ if (this.memory) return this.memory;
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) this.memory = JSON.parse(raw); } catch { this.persistOk=false; }
    if (!this.memory) this.memory = {db:seedData(), commands:structuredClone(DEFAULT_COMMANDS), session:{user:'montør.demo1', role:'Installer', lang:'da'}};
    return this.memory; },
  save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.memory)); this.persistOk=true; }
    catch { if (this.persistOk) toast(t('storageFull')); this.persistOk=false; } },
  reset(){ try{ localStorage.removeItem(STORAGE_KEY); }catch{} this.memory=null; return this.load(); }
};

  audit(db, entityType, entityId, action, oldValue, newValue, reason){

    this.audit(s.db,'Installation',inst.installationId,'note',null,{text},''); this.a.save(); },
  async addPhoto(cid, photo){ const s=this.a.load(); const inst=currentInst(cid);

    this.audit(s.db,'Installation',inst.installationId,'photo',null,{fileName:photo.fileName, sha256:photo.sha256},''); this.a.save(); },

  async verifyPosition(cid, pos){ const s=this.a.load(); const loc=currentLoc(cid); const old={lat:loc.verifiedLatitude, lng:loc.verifiedLongitude};

  async move(cid, data){ const s=this.a.load(); const old=currentInst(cid); const t0=nowIso();

  async setStatus(cid, status, reason){ const s=this.a.load(); const c=concentrator(cid); const old=c.operationalStatus;
    c.operationalStatus=status; c.updatedAt=nowIso(); c.updatedBy=s.session.user;
    this.audit(s.db,'Concentrator',cid,'status',{status:old},{status},reason); this.a.save(); },
  async openJob(cid){ const s=this.a.load(); const n=s.db.jobs.length+1;
    const job={jobId:'J-'+String(n).padStart(4,'0'), concentratorId:cid, openedAt:nowIso(), openedBy:s.session.user, closedAt:null, outcome:null, summary:'', gps:null, log:[]};
    s.db.jobs.push(job); this.audit(s.db,'Concentrator',cid,'job_open',null,{jobId:job.jobId},''); this.a.save(); return job.jobId; },
  async logJob(jobId, entry){ const s=this.a.load(); const j=s.db.jobs.find(x=>x.jobId===jobId); j.log.push({at:nowIso(), ...entry}); this.a.save(); },
  async closeJob(jobId, outcome, summary, gps){ const s=this.a.load(); const j=s.db.jobs.find(x=>x.jobId===jobId);
    Object.assign(j,{closedAt:nowIso(), outcome, summary, gps}); this.audit(s.db,'Concentrator',j.concentratorId,'job_close',null,{jobId, outcome},summary); this.a.save(); },
  async saveCommands(cmds){ const s=this.a.load(); s.commands=cmds; this.a.save(); },
  async saveSession(patch){ const s=this.a.load(); Object.assign(s.session, patch); this.a.save(); }

/* =====================================================================
   6. State + selectors
   ===================================================================== */
const STATE = {db:null, commands:null, session:null, me:null, sim:false, filters:{tech:new Set(), status:new Set(), flags:new Set()}, q:'',
  tab:'map', detailId:null, jobId:null, pickMode:null};
const concentrator = id => STATE.db.concentrators.find(c=>c.concentratorId===id);
const currentInst = id => STATE.db.installations.find(i=>i.concentratorId===id && i.isCurrent) || STATE.db.installations.filter(i=>i.concentratorId===id).slice(-1)[0];
const currentLoc = id => { const i=currentInst(id); return STATE.db.locations.find(l=>l.locationId===i.locationId); };
const techOf = c => TECH.find(x=>x.technologyId===c.technologyId) || TECH[TECH.length-1];
const posOf = loc => loc.verifiedLatitude!=null ? {lat:loc.verifiedLatitude,lng:loc.verifiedLongitude,verified:true} : {lat:loc.latitude,lng:loc.longitude,verified:false};
const photosOf = instId => STATE.db.photos.filter(p=>p.installationId===instId).sort((a,b)=>(b.isPrimary-a.isPrimary));
function isIncomplete(c, loc){ return !loc.physicalLocationDescription || !loc.accessInstructions || !c.model || !c.serialNumber; }
function rows(){
  return STATE.db.concentrators.map(c=>{ const inst=currentInst(c.concentratorId), loc=currentLoc(c.concentratorId), pos=posOf(loc);
    const photos=photosOf(inst.installationId); const dist = STATE.me ? haversine(STATE.me, pos) : null;
    return {c, inst, loc, pos, photos, dist}; });
}
function filtered(){
  const q = STATE.q.trim().toLowerCase(); const f = STATE.filters;
  let r = rows().filter(({c,loc,photos})=>{
    if (f.tech.size && !f.tech.has(c.technologyId)) return false;
    if (f.status.size && !f.status.has(c.operationalStatus)) return false;
    if (f.flags.has('withPhoto') && !photos.length) return false;
    if (f.flags.has('noPhoto') && photos.length) return false;
    if (f.flags.has('unverified') && loc.verificationStatus==='verified') return false;
    if (f.flags.has('stale') && ageYears(loc.lastVerifiedAt) < 2) return false;
    if (f.flags.has('incomplete') && !isIncomplete(c,loc)) return false;
    if (q){ const hay=[c.concentratorId,c.externalId,c.serialNumber,c.model,techOf(c).name,loc.referenceAddress,loc.postalCode,loc.city,
        loc.physicalLocationDescription,loc.accessInstructions,t('lt_'+loc.locationType),
        ...STATE.db.notes.filter(n=>n.concentratorId===c.concentratorId).map(n=>n.text)].join(' ').toLowerCase();
      if (!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
    return true; });
  r.sort((a,b)=> a.dist!=null && b.dist!=null ? a.dist-b.dist : a.c.concentratorId.localeCompare(b.c.concentratorId));
  return r;
}
function statusBadge(s){ return `<span class="badge ${STATUS_CLASS[s]||''}">${esc(t('st_'+s))}</span>`; }
function techBadge(c){ const x=techOf(c); return `<span class="badge"><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</span>`; }
function verifyBadge(loc){ if (loc.verificationStatus==='needs-check') return `<span class="badge b-bad">⚠ ${esc(t('needsCheck'))}</span>`;
  if (!loc.lastVerifiedAt) return `<span class="badge b-warn">${esc(t('unverifiedBadge'))}</span>`;
  if (ageYears(loc.lastVerifiedAt)>=2) return `<span class="badge b-warn">⏱ ${esc(t('staleBadge'))}</span>`;
  return `<span class="badge b-ok">✓ ${esc(t('verifiedBadge'))}</span>`; }

/* =====================================================================
   8. Map (Leaflet + OSM for the prototype; Azure Maps in production)
   ===================================================================== */
let map, markerLayer, meMarker, meCircle, lineLayer;
function initMap(){
  map = L.map('map', {zoomControl:true, preferCanvas:true}).setView([56.165,10.18], 12);
  let tileErrors = 0, tileOk = 0;
  const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
  tiles.on('tileload', ()=>{ tileOk++; }).on('tileerror', ()=>{ tileErrors++; if (tileErrors>3 && !tileOk){ $('#map').classList.add('notiles'); const n=$('#tileNote'); n.textContent=t('tilesBlocked'); n.hidden=false; setTimeout(()=>n.hidden=true, 9000);} });
  tiles.addTo(map);
  markerLayer = L.layerGroup().addTo(map); lineLayer = L.layerGroup().addTo(map);
  map.on('click', e=>{
    if (STATE.pickMode){ const cb=STATE.pickMode; STATE.pickMode=null; cb(e.latlng); return; }
    if (STATE.sim){ setMe({lat:e.latlng.lat, lng:e.latlng.lng, acc:5, simulated:true}); STATE.sim=false; }
  });
}
function renderMarkers(){
  markerLayer.clearLayers();
  for (const r of filtered()){
    const x=techOf(r.c); const off = ['Decommissioned','Removed'].includes(r.c.operationalStatus);
    const m = L.circleMarker([r.pos.lat, r.pos.lng], {radius: STATE.detailId===r.c.concentratorId?13:9, color: off?'#555':(r.loc.verificationStatus==='verified'?'#fff':'#f9c400'),
      weight: STATE.detailId===r.c.concentratorId?5:3, fillColor: off?'#9e9e9e':x.color, fillOpacity: off?.5:.95, dashArray: off?'3 3':null});
    m.bindTooltip(`${esc(r.c.concentratorId)} · ${esc(t('lt_'+r.loc.locationType))}`, {direction:'top'});
    m.on('click', ()=>openDetail(r.c.concentratorId));
    markerLayer.addLayer(m);
  }
  drawLine();
}
function drawLine(){
  lineLayer.clearLayers();
  if (!STATE.me || !STATE.detailId) return;
  const p = posOf(currentLoc(STATE.detailId));
  L.polyline([[STATE.me.lat,STATE.me.lng],[p.lat,p.lng]], {color:'#0b2a3c', weight:4, dashArray:'8 8'}).addTo(lineLayer);
}

/* =====================================================================
   9. GPS
   ===================================================================== */
let watchId = null;
function startGps(){
  if (!('geolocation' in navigator)){ gpsFailed(); return; }
  toast(t('gpsWait'));
  try {
    if (watchId!=null) navigator.geolocation.clearWatch(watchId);
    let first = true;
    watchId = navigator.geolocation.watchPosition(p=>{
      setMe({lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy), simulated:false}, first); first=false;
    }, gpsFailed, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
  } catch { gpsFailed(); }
}
function gpsFailed(){ $('#btnSimPos').hidden=false; toast(t('gpsDenied')); renderNearest(); }
function setMe(me, fly=true){
  STATE.me = me;
  const ll=[me.lat,me.lng];
  if (!meMarker){ meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="you"></div>',iconSize:[20,20],iconAnchor:[10,10]}), zIndexOffset:1000}).addTo(map);
    meCircle=L.circle(ll,{radius:me.acc,color:'#1565c0',weight:1,fillOpacity:.1}).addTo(map); }
  meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(me.acc);
  meMarker.bindTooltip(t('youAreHere',{a:me.acc}) + (me.simulated?' · '+t('simulated'):''));
  if (fly && STATE.tab==='map' && !STATE.detailId) map.setView(ll, 16);
  renderAll();
}

function showTab(tab){
  STATE.tab = tab;
  const wide = matchMedia('(min-width:960px)').matches;
  for (const v of ['map','list','detail','jobs','job','more']) $('#v-'+v).hidden = !(v===tab || (wide && v==='map'));
  if (wide && tab==='map') { $('#v-list').hidden=false; STATE.tab='list'; }
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===({detail:'list',job:'jobs'}[tab]||tab) ? 'page':'false'));
  if (tab==='map' || wide) setTimeout(()=>map.invalidateSize(), 50);
  const show = ['map','list'].includes(tab) || (wide && tab!=='more');
  document.querySelector('.searchbar').style.display = show ? '' : 'none';
}

/* =====================================================================
   12. Photo intake: type/size check, resize, thumbnail, SHA-256
   ===================================================================== */
let photoTarget = null;
$('#fileIn').addEventListener('change', async e=>{
  const file = e.target.files && e.target.files[0]; e.target.value=''; if (!file || !photoTarget) return;
  if (!['image/jpeg','image/png','image/webp'].includes(file.type)){ toast(t('photoType')); return; }
  if (file.size > 15*1024*1024){ toast(t('photoTooBig')); return; }
  toast(t('photoProc'));
  try {
    const buf = await file.arrayBuffer();
    let sha256 = ''; try { const h = await crypto.subtle.digest('SHA-256', buf); sha256 = [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); } catch {}
    const bmp = await createImageBitmap(new Blob([buf],{type:file.type}));
    const scaled = max => { const k=Math.min(1, max/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas');
      cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); return cv.toDataURL('image/jpeg',.8); };
    // Re-encoding through canvas strips EXIF (incl. GPS) and any non-image payload.
    const img = {fileName:file.name.replace(/[^\w.\-]/g,'_').slice(0,80), dataUrl:scaled(1280), thumbDataUrl:scaled(320), sha256, takenAt:new Date(file.lastModified||Date.now()).toISOString()};
    if (sha256 && STATE.db.photos.some(p=>p.sha256===sha256)) toast('Duplicate (SHA-256)');
    photoMetaSheet(photoTarget, img);
  } catch { toast(t('photoType')); }
});

/* =====================================================================
   13. Photo viewer
   ===================================================================== */
let viewerList = [], viewerIdx = 0;
function openViewer(photoId){
  const ph = STATE.db.photos.find(p=>p.photoId===photoId); viewerList = photosOf(ph.installationId); viewerIdx = viewerList.findIndex(p=>p.photoId===photoId);
  $('#viewer').hidden=false; showViewer();
}
function showViewer(){ const p=viewerList[viewerIdx]; $('#viewerImg').src=fullSrc(p);
  $('#viewerTxt').innerHTML = `${esc(p.caption||'')}<br><span style="opacity:.75">${fmtDate(p.takenAt||p.uploadedAt)} · ${esc(p.uploadedBy||'')}${p.isPrimary?' · ★ '+esc(t('primary')):''}</span>
    ${!p.isPrimary && can('photo')?` <button class="warn" style="width:auto;min-height:36px;padding:4px 10px;margin-top:4px" id="vPrim">★ ${esc(t('setPrimary'))}</button>`:''}`;
  const b=$('#vPrim'); if (b) b.onclick=async()=>{ await repo.setPrimary(p.photoId); await refresh(); viewerList=photosOf(p.installationId); viewerIdx=viewerList.findIndex(x=>x.photoId===p.photoId); showViewer(); };
}
$('#viewerClose').onclick=()=>{ $('#viewer').hidden=true; };
$('#viewerPrev').onclick=()=>{ viewerIdx=(viewerIdx-1+viewerList.length)%viewerList.length; showViewer(); };
$('#viewerNext').onclick=()=>{ viewerIdx=(viewerIdx+1)%viewerList.length; showViewer(); };

/* =====================================================================
   14. Event wiring (one delegated handler)
   ===================================================================== */
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-open],[data-act],[data-photo],[data-job],[data-cmd],[data-copy],[data-flag],[data-tab]'); if (!el) return;
  if (el.closest('#sheet') && !el.dataset.cmd) return;
  if (el.dataset.tab){ const tb=el.dataset.tab; if (tb==='more') renderMore(); if (tb==='jobs') renderJobs(); showTab(tb); return; }
  if (el.dataset.open){ openDetail(el.dataset.open); return; }
  if (el.dataset.photo){ openViewer(el.dataset.photo); return; }
  if (el.dataset.job){ STATE.jobId=el.dataset.job; showTab('job'); renderJob(); return; }
  if (el.dataset.cmd){ cmdSheet(el.dataset.cmd); return; }
  if (el.dataset.copy){ copyText(el.dataset.copy); return; }
  if (el.dataset.flag){ STATE.filters.flags.clear(); STATE.filters.flags.add(el.dataset.flag); renderAll(); showTab('list'); return; }
  const id = STATE.detailId;
  switch (el.dataset.act){
    case 'back': STATE.detailId=null; lineLayer.clearLayers(); showTab(matchMedia('(min-width:960px)').matches?'list':'map'); renderMarkers(); break;
    case 'backJobs': renderJobs(); showTab('jobs'); break;
    case 'clearFilters': STATE.filters.tech.clear(); STATE.filters.status.clear(); STATE.filters.flags.clear(); STATE.q=''; $('#q').value=''; renderAll(); break;
    case 'verify': if (guard('verify')) verifySheet(id); break;
    case 'addNote': if (guard('note')) noteSheet(id); break;
    case 'addPhoto': if (guard('photo')){ photoTarget=id; $('#fileIn').click(); } break;
    case 'report': reportSheet(id); break;
    case 'move': if (guard('move')) moveSheet(id); break;
    case 'status': if (guard('status')) statusSheet(id); break;
    case 'startJob': if (guard('job')){ const open=STATE.db.jobs.find(j=>j.concentratorId===id && !j.closedAt);
        STATE.jobId = open ? open.jobId : await repo.openJob(id); await refresh(); showTab('job'); renderJob(); } break;
    case 'reply': replySheet('sms-in'); break;
    case 'jobNote': replySheet('note'); break;
    case 'closeJob': closeJobSheet(); break;
    case 'copyReport': copyText(jobReport(STATE.db.jobs.find(x=>x.jobId===STATE.jobId))); break;
    case 'exportJobs': { const head='jobId;concentratorId;openedAt;closedAt;openedBy;outcome;summary;smsCount';
      const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
      copyText([head, ...STATE.db.jobs.map(j=>[j.jobId,j.concentratorId,j.openedAt,j.closedAt||'',j.openedBy,j.outcome||'',j.summary,j.log.filter(x=>x.type==='sms-out').length].map(q).join(';'))].join('\n')); break; }
    case 'saveCmds': { if (!guard('catalog')) break; const cmds = STATE.commands.map((c,i)=>({...c, text:document.querySelector(`[data-cmdtext="${i}"]`).value.trim(), verified:document.querySelector(`[data-cmdver="${i}"]`).checked}));
      await repo.saveCommands(cmds); await refresh(); renderMore(); toast(t('save')+' ✓'); break; }
    case 'reset': { const s=repo.a.reset(); STATE.detailId=null; STATE.jobId=null; await refresh(); renderMore(); toast(t('resetDone')); break; }
  }
});
document.querySelector('nav.tabs').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if (b && b.dataset.tab==='list') renderList(); });
let qTimer; $('#q').addEventListener('input', e=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ STATE.q=e.target.value; renderAll();
  if (STATE.q && STATE.tab==='map'){ const r=filtered(); if (r.length===1) openDetail(r[0].c.concentratorId); else if (r.length) map.fitBounds(L.latLngBounds(r.map(x=>[x.pos.lat,x.pos.lng])).pad(.2), {maxZoom:16}); } }, 200); });
$('#q').addEventListener('keydown', e=>{ if (e.key==='Enter'){ const r=filtered(); if (r.length) openDetail(r[0].c.concentratorId); } });
$('#btnFilter').onclick = filterSheet;
$('#btnLocate').onclick = startGps;
$('#btnSimPos').onclick = ()=>{ STATE.sim=true; toast(t('simTap')); };
$('#lang').onchange = async e=>{ LANG=e.target.value; await repo.saveSession({lang:LANG}); applyI18n(); renderAll(); if(!$('#v-more').hidden) renderMore(); if(!$('#v-job').hidden) renderJob(); };
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ if(!$('#viewer').hidden) $('#viewer').hidden=true; else if(!$('#sheet').hidden) closeSheet(); } });

/* =====================================================================
   15. Boot
   ===================================================================== */
(async function boot(){
  $('#listWrap').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const s = await repo.snapshot(); STATE.db=s.db; STATE.commands=s.commands; STATE.session=s.session;
  LANG = s.session.lang || 'da'; $('#lang').value = LANG; applyI18n();
  initMap(); showTab('map'); renderAll();
  // Permissions API lets us start GPS silently only if it was granted before.
  try { if (navigator.permissions){ const p = await navigator.permissions.query({name:'geolocation'}); if (p.state==='granted') startGps(); else if (p.state==='denied') $('#btnSimPos').hidden=false; } } catch { $('#btnSimPos').hidden=false; }
})();
</script>
